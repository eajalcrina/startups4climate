name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Public, non-secret placeholders: the build and tests must not need a real
  # Supabase project. Server-only secrets are intentionally absent.
  NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
  NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-dummy-anon-key
  NEXT_TELEMETRY_DISABLED: '1'

jobs:
  checks:
    name: Lint, typecheck, test, build, audit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Audit production dependencies (critical)
        run: npm audit --omit=dev --audit-level=critical
        continue-on-error: false

  e2e:
    name: E2E (production build, Chromium)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Optional while the suite stabilizes: failures are reported but do not
    # block merges. Remove continue-on-error to make it required.
    continue-on-error: true
    env:
      CI: 'true'
      E2E_PROD: '1'
      # @demo specs need demo-session data flows; skipped in CI.
      E2E_SKIP_DEMO: '1'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Build
        run: npm run build

      - name: Run Playwright (starts `npm start` via webServer)
        run: npx playwright test

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
